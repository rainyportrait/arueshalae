[package]
name = "arueshalae"
version = "0.2.2"
edition = "2024"
rust-version = "1.85.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum_typed_multipart = "0.16.7"
bytes = "1.12.1"
camino = "1.2.5"
clap = { version = "4.6.6", features = ["derive"] }
infer = "0.22.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "signal",
  "process",
] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
anyhow = "1.0.104"
camino = "1.2.5"
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "process",
] }
